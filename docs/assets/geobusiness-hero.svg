<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GeoBusiness Intelligence Studio architecture and interface overview</title>
<desc id="desc">A stylized dark blue dashboard with search controls, quality metrics, a map, provider adapters, FastAPI, and optional AI.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08162f"/><stop offset="0.55" stop-color="#22346d"/><stop offset="1" stop-color="#5362ff"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#020817" flood-opacity=".35"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1390" cy="110" r="240" fill="#7983ff" opacity=".18"/><circle cx="100" cy="820" r="300" fill="#0dd5c0" opacity=".10"/>
<text x="110" y="108" fill="#8da0ff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">OPEN DATA · GEOSPATIAL INTELLIGENCE · OPTIONAL BYOK AI</text>
<text x="110" y="190" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800">GeoBusiness Intelligence Studio</text>
<text x="112" y="242" fill="#dbe3ff" font-family="Arial,Helvetica,sans-serif" font-size="27">Discover, normalize, map, compare, analyze, and export local-business records.</text>
<g filter="url(#shadow)"><rect x="95" y="295" width="1410" height="505" rx="34" fill="url(#card)"/></g>
<text x="135" y="350" fill="#6375ff" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">DISCOVERY WORKFLOW</text>
<text x="135" y="396" fill="#111c37" font-family="Arial" font-size="34" font-weight="800">Search businesses</text>
<g font-family="Arial">
  <rect x="135" y="430" width="245" height="72" rx="16" fill="#fff" stroke="#cad3ec"/><text x="155" y="454" fill="#61708f" font-size="15" font-weight="700">PROVIDER</text><text x="155" y="484" fill="#15213d" font-size="20" font-weight="700">OpenStreetMap</text>
  <rect x="400" y="430" width="300" height="72" rx="16" fill="#fff" stroke="#cad3ec"/><text x="420" y="454" fill="#61708f" font-size="15" font-weight="700">BUSINESS TYPE</text><text x="420" y="484" fill="#15213d" font-size="20" font-weight="700">coffee</text>
  <rect x="720" y="430" width="270" height="72" rx="16" fill="#fff" stroke="#cad3ec"/><text x="740" y="454" fill="#61708f" font-size="15" font-weight="700">CITY</text><text x="740" y="484" fill="#15213d" font-size="20" font-weight="700">Amsterdam</text>
  <rect x="1010" y="430" width="180" height="72" rx="16" fill="#fff" stroke="#cad3ec"/><text x="1030" y="454" fill="#61708f" font-size="15" font-weight="700">RADIUS</text><text x="1030" y="484" fill="#15213d" font-size="20" font-weight="700">5 km</text>
  <rect x="1210" y="430" width="250" height="72" rx="16" fill="#4d5cff"/><text x="1271" y="475" fill="#fff" font-size="22" font-weight="800">Run search</text>
</g>
<g font-family="Arial">
  <rect x="135" y="545" width="285" height="116" rx="22" fill="#fff" stroke="#d6deef"/><text x="160" y="600" fill="#07142f" font-size="42" font-weight="800">29</text><text x="160" y="633" fill="#5e6b89" font-size="17" font-weight="700">records</text>
  <rect x="440" y="545" width="285" height="116" rx="22" fill="#fff" stroke="#d6deef"/><text x="465" y="600" fill="#07142f" font-size="42" font-weight="800">31%</text><text x="465" y="633" fill="#5e6b89" font-size="17" font-weight="700">with phone</text>
  <rect x="745" y="545" width="285" height="116" rx="22" fill="#fff" stroke="#d6deef"/><text x="770" y="600" fill="#07142f" font-size="42" font-weight="800">55%</text><text x="770" y="633" fill="#5e6b89" font-size="17" font-weight="700">with website</text>
  <rect x="1050" y="545" width="410" height="116" rx="22" fill="#fff" stroke="#d6deef"/><text x="1075" y="600" fill="#07142f" font-size="42" font-weight="800">69 / 100</text><text x="1075" y="633" fill="#5e6b89" font-size="17" font-weight="700">average data-quality score</text>
</g>
<g font-family="Arial" font-weight="700">
  <rect x="135" y="700" width="210" height="60" rx="18" fill="#12244e"/><text x="177" y="738" fill="#fff" font-size="19">Data providers</text>
  <path d="M355 730 H430" stroke="#6075ff" stroke-width="7" stroke-linecap="round"/><polygon points="430,730 411,719 411,741" fill="#6075ff"/>
  <rect x="445" y="700" width="210" height="60" rx="18" fill="#12244e"/><text x="510" y="738" fill="#fff" font-size="19">FastAPI</text>
  <path d="M665 730 H740" stroke="#6075ff" stroke-width="7" stroke-linecap="round"/><polygon points="740,730 721,719 721,741" fill="#6075ff"/>
  <rect x="755" y="700" width="250" height="60" rx="18" fill="#12244e"/><text x="795" y="738" fill="#fff" font-size="19">Normalize &amp; dedupe</text>
  <path d="M1015 730 H1090" stroke="#6075ff" stroke-width="7" stroke-linecap="round"/><polygon points="1090,730 1071,719 1071,741" fill="#6075ff"/>
  <rect x="1105" y="700" width="355" height="60" rx="18" fill="#12244e"/><text x="1155" y="738" fill="#fff" font-size="19">Map · Analyze · Export</text>
</g>
</svg>